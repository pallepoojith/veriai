<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClaimCheck</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>ClaimCheck</h1>
    <p>Check a post or link before you trust it.</p>
  </header>

  <form id="form">
    <label for="url" class="sr">Link to check</label>
    <input id="url" type="url" placeholder="Paste a link from YouTube, Instagram, Facebook..." required>
    <button id="go" type="submit">Check</button>
  </form>

  <p id="status" role="status" hidden></p>
  <main id="result" hidden></main>

  <details id="settings">
    <summary>Settings</summary>
    <label for="api">Analysis server</label>
    <input id="api" type="url" placeholder="http://localhost:8000/api/analyze">
    <label class="row"><input id="demo" type="checkbox"> Use demo result (no server needed)</label>
  </details>

  <script src="popup.js"></script>
</body>
</html>
