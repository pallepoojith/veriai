<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VeriAI One Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column on a drifting colour wash. Top bar with language and theme controls, search and examples, recent checks, then a verdict banner and a two-column scorecard. */
:root{
  --bg:#eef1ff; --ink:#171a3a; --ink-soft:#4f557d; --card:rgba(255,255,255,.9); --line:rgba(60,70,160,.16);
  --g1:#c3d3ff; --g2:#e1caff; --g3:#ffd3e8;
  --blue:#3556ff; --violet:#8447f0; --pink:#e83e94; --sun:#f5a300; --mint:#0f9b6a;
  --good:#0b8a5c; --good-soft:#d6f5e7;
  --warn:#a86a00; --warn-soft:#ffefc7;
  --bad:#d6401a; --bad-soft:#ffe1d6;
  --scam:#c81f78; --scam-soft:#ffd9ec;
  --on-tone:#ffffff; --wa:#128c4f; --accent-soft:#e6eaff; --track:rgba(23,26,58,.09);
  --display:'Bricolage Grotesque','Noto Sans Devanagari','Noto Sans Telugu','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans','Noto Sans Devanagari','Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f2c; --ink:#eef0ff; --ink-soft:#a9afd6; --card:rgba(24,28,66,.88); --line:rgba(150,160,255,.2);
    --g1:#1b2766; --g2:#3a1d75; --g3:#5b1a4e;
    --blue:#7e95ff; --violet:#b48cff; --pink:#ff7cbc; --sun:#ffc552; --mint:#43d9a0;
    --good:#43d9a0; --good-soft:#0f3b2c;
    --warn:#ffc552; --warn-soft:#41300a;
    --bad:#ff8a63; --bad-soft:#47200f;
    --scam:#ff7cbc; --scam-soft:#4a1636;
    --on-tone:#0c0f2c; --wa:#3fd18a; --accent-soft:#1d2461; --track:rgba(255,255,255,.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f2c; --ink:#eef0ff; --ink-soft:#a9afd6; --card:rgba(24,28,66,.88); --line:rgba(150,160,255,.2);
  --g1:#1b2766; --g2:#3a1d75; --g3:#5b1a4e;
  --blue:#7e95ff; --violet:#b48cff; --pink:#ff7cbc; --sun:#ffc552; --mint:#43d9a0;
  --good:#43d9a0; --good-soft:#0f3b2c;
  --warn:#ffc552; --warn-soft:#41300a;
  --bad:#ff8a63; --bad-soft:#47200f;
  --scam:#ff7cbc; --scam-soft:#4a1636;
  --on-tone:#0c0f2c; --wa:#3fd18a; --accent-soft:#1d2461; --track:rgba(255,255,255,.1);
  color-scheme:dark;
}

*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.55; -webkit-font-smoothing:antialiased; font-size:15px;}
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; background:linear-gradient(125deg,var(--g1),var(--g2),var(--g3),var(--g1)); background-size:300% 300%; animation:drift 22s ease-in-out infinite;}
@keyframes drift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
#confetti{position:fixed; inset:0; width:100%; height:100%; z-index:50; pointer-events:none;}
.wrap{position:relative; z-index:1; max-width:940px; margin:0 auto; padding-inline:18px; padding-block:26px 80px;}
svg.i{width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
button{font-family:inherit;}
button:focus-visible{outline:3px solid var(--violet); outline-offset:2px;}

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px 20px; flex-wrap:wrap; margin-bottom:32px;}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.mark{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:#fff; font-size:24px; flex:none; background:linear-gradient(135deg,var(--blue),var(--violet) 60%,var(--pink)); box-shadow:0 8px 22px -6px var(--violet); animation:bounceIn .9s cubic-bezier(.28,.84,.42,1) both, float 3.4s ease-in-out 1s infinite;}
@keyframes bounceIn{0%{transform:translateY(-70px) scale(.6); opacity:0;}45%{transform:translateY(0) scale(1.1); opacity:1;}62%{transform:translateY(-16px) scale(.97);}80%{transform:translateY(0) scale(1.03);}100%{transform:none;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.brand b{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.02em;}
.brand small{color:var(--ink-soft); font-weight:500; font-size:13px; overflow-wrap:anywhere;}
.tools{display:flex; align-items:center; gap:10px;}
.seg{display:inline-flex; padding:4px; gap:2px; border-radius:99px; background:var(--card); border:1.5px solid var(--line);}
.seg button{border:0; background:transparent; color:var(--ink-soft); font:700 13.5px/1 var(--body); padding:8px 14px; border-radius:99px; cursor:pointer; transition:background .15s, color .15s;}
.seg button:hover{color:var(--ink);}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff;}
.iconbtn{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:19px; cursor:pointer; background:var(--card); border:1.5px solid var(--line); color:var(--ink); transition:transform .15s, border-color .15s;}
.iconbtn:hover{transform:rotate(18deg); border-color:var(--violet);}

/* hero */
.hero h1{font-family:var(--display); font-weight:800; font-size:clamp(32px,6.4vw,54px); line-height:1.08; letter-spacing:-.03em; margin:0 0 12px; max-width:16ch; text-wrap:balance;}
.hero h1 em{font-style:normal; background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{margin:0 0 22px; color:var(--ink-soft); font-size:16.5px; max-width:54ch;}

form{display:flex; gap:10px; flex-wrap:wrap;}
input[type=text]{flex:1 1 260px; min-width:0; padding:16px 18px; border:2px solid var(--line); border-radius:16px; font:500 16px/1.3 var(--body); background:var(--card); color:var(--ink); transition:border-color .15s, box-shadow .15s;}
input[type=text]::placeholder{color:var(--ink-soft); opacity:.8;}
input[type=text]:focus-visible{outline:none; border-color:var(--violet); box-shadow:0 0 0 5px color-mix(in srgb,var(--violet) 25%,transparent);}
button.go{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:16px 30px; border:0; border-radius:16px; color:#fff; font:700 16px/1 var(--body); cursor:pointer; background:linear-gradient(135deg,var(--blue),var(--violet)); box-shadow:0 10px 24px -10px var(--blue); transition:transform .12s, filter .15s;}
button.go:hover{filter:brightness(1.1) saturate(1.1);}
button.go:active{transform:scale(.96);}
button.go:disabled{opacity:.55; cursor:default;}

.examples{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.chip{display:inline-flex; align-items:center; gap:8px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:8px 15px 8px 11px; font:600 13.5px/1.2 var(--body); cursor:pointer; text-align:left; transition:transform .12s, border-color .15s;}
.chip .ico{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:var(--on-tone); font-size:13px; background:var(--c); flex:none;}
.chip:hover{transform:translateY(-2px); border-color:var(--c);}

/* recent checks */
.history{margin-top:22px; display:flex; align-items:center; flex-wrap:wrap; gap:8px;}
.history[hidden]{display:none!important;}
.history .hl{display:inline-flex; align-items:center; gap:6px; font:700 12px/1 var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-right:4px;}
.hchip{display:inline-flex; align-items:center; gap:8px; max-width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:7px 12px; font:600 13px/1.2 var(--body); cursor:pointer; transition:border-color .15s;}
.hchip:hover{border-color:var(--violet);}
.hchip .dot{width:10px; height:10px; border-radius:50%; background:var(--c); flex:none;}
.hchip span.tx{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;}

/* stat badges */
.stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px;}
.stat{display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 16px 10px 12px;}
.stat .ico{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:18px; color:var(--on-tone);}
.stat:nth-child(1) .ico{background:var(--blue);} .stat:nth-child(2) .ico{background:var(--mint);} .stat:nth-child(3) .ico{background:var(--pink);}
.stat b{font-family:var(--display); font-size:19px; font-weight:800; display:block; line-height:1.15; font-variant-numeric:tabular-nums;}
.stat span.t{font-size:12px; color:var(--ink-soft); font-weight:500;}
.stats-note{flex-basis:100%; font-size:12px; color:var(--ink-soft); margin:-2px 0 0;}

/* pipeline */
#trace{margin-top:26px; max-width:460px; background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:10px 18px;}
#trace[hidden]{display:none!important;}
.step{display:flex; gap:12px; padding:9px 0; opacity:0; transform:translateY(5px); animation:in .35s ease forwards;}
.step .dot{flex:none; width:24px; height:24px; border-radius:50%; margin-top:1px; border:2px solid var(--line); display:grid; place-items:center; font-size:12px; color:transparent; transition:all .25s;}
.step.active .dot{border-color:var(--violet); box-shadow:0 0 0 6px color-mix(in srgb,var(--violet) 22%,transparent); animation:pulse 1s ease-in-out infinite;}
.step.done .dot{border-color:var(--good); background:var(--good); color:var(--on-tone);}
.step .label{font-size:14.5px; font-weight:600; color:var(--ink-soft);}
.step.done .label{color:var(--ink);}
.step .sub{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.step .sub.found{color:var(--good); font-weight:500; font-family:var(--body); font-size:12.5px;}
@keyframes in{to{opacity:1; transform:none;}}
@keyframes pulse{50%{box-shadow:0 0 0 10px transparent;}}

/* result */
#result[hidden]{display:none!important;}
#result{margin-top:28px; scroll-margin-top:16px;}
.block{opacity:0; transform:translateY(16px) scale(.97); animation:pop .6s cubic-bezier(.3,1.3,.5,1) forwards;}
@keyframes pop{to{opacity:1; transform:none;}}

.banner{--tone:var(--warn); --tone-soft:var(--warn-soft); display:flex; align-items:center; gap:30px; flex-wrap:wrap; padding:28px 30px; border-radius:26px; border:2px solid var(--tone); background:linear-gradient(135deg,var(--tone-soft),var(--card) 75%); box-shadow:0 24px 50px -24px var(--tone);}
.banner.good{--tone:var(--good); --tone-soft:var(--good-soft);}
.banner.bad{--tone:var(--bad); --tone-soft:var(--bad-soft);}
.banner.warn{--tone:var(--warn); --tone-soft:var(--warn-soft);}
.banner.scam{--tone:var(--scam); --tone-soft:var(--scam-soft);}
.gauge{position:relative; width:140px; height:140px; flex:none; filter:drop-shadow(0 0 12px color-mix(in srgb,var(--tone) 55%,transparent)); animation:glow 2.6s ease-in-out infinite;}
@keyframes glow{50%{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--tone) 80%,transparent));}}
.gauge svg{width:140px; height:140px; transform:rotate(-90deg);}
.gauge circle{fill:none; stroke-width:13;}
.gauge .track{stroke:var(--track);}
.gauge .value{stroke:var(--tone); stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.16,.9,.2,1);}
.gauge .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge .num b{font-family:var(--display); font-weight:800; font-size:46px; line-height:1; color:var(--tone); font-variant-numeric:tabular-nums;}
.gauge .num span{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px; text-align:center; max-width:90px; line-height:1.2;}
.banner-main{flex:1 1 260px; min-width:0;}
.verdict-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.verdict-pill{display:inline-flex; align-items:center; gap:8px; padding:9px 18px 9px 14px; border-radius:99px; font:800 16px/1.2 var(--body); background:var(--tone); color:var(--on-tone);}
.verdict-pill .i{font-size:19px; stroke-width:2.6;}
.conf{font-size:13px; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.claim{font-family:var(--display); font-weight:600; font-size:clamp(19px,3.4vw,24px); line-height:1.3; margin:14px 0 10px; overflow-wrap:anywhere; text-wrap:balance;}
.metaline{display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px;}
.stamp{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
.copybtn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:99px; border:1.5px solid var(--tone); background:transparent; color:var(--ink); font:700 13px/1 var(--body); cursor:pointer; transition:background .15s;}
.copybtn:hover{background:var(--tone-soft);}
.copybtn.ok{background:var(--tone); color:var(--on-tone);}
.fallback{display:block; width:100%; margin-top:10px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:13px/1.45 var(--body); resize:vertical; min-height:96px;}

.grid{display:grid; grid-template-columns:1.1fr 1fr; gap:18px; margin-top:18px;}
.grid > *{min-width:0;}
@media (max-width:720px){.grid{grid-template-columns:1fr;} .banner{padding:24px 20px;}}
@media (max-width:560px){.banner{flex-direction:column; align-items:stretch; gap:20px;} .gauge{align-self:center;} .banner-main{flex:none;}}
.card{background:var(--card); border:1.5px solid var(--line); border-left:6px solid var(--c); border-radius:20px; padding:20px 22px;}
.card.c-blue{--c:var(--blue);} .card.c-violet{--c:var(--violet);} .card.c-mint{--c:var(--mint);} .card.c-pink{--c:var(--pink);} .card.c-bad{--c:var(--bad);}
.card h3{display:flex; align-items:center; gap:9px; margin:0 0 16px; font:700 12.5px/1.2 var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
.card h3 .i{font-size:18px; color:var(--c);}

.subgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 14px;}
@media (max-width:420px){.subgrid{grid-template-columns:1fr;}}
.subcell{display:flex; align-items:center; gap:12px; padding:8px 0; min-width:0;}
.ring{position:relative; width:52px; height:52px; flex:none;}
.ring svg{width:52px; height:52px; transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:5.5;}
.ring .track{stroke:var(--track);}
.ring .val{stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.16,.9,.2,1);}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}
.subcell .lbl{font-size:13px; font-weight:600; line-height:1.3;}
.subcell .lbl small{display:block; font-size:12px; font-weight:700;}

.explain{margin:0; font-size:14.5px; line-height:1.65; background:var(--accent-soft); border-radius:14px; padding:15px 17px; overflow-wrap:anywhere;}

.ev{display:flex; gap:12px; padding:11px 0; border-top:1.5px dashed var(--line);}
.ev:first-of-type{border-top:0; padding-top:0;}
.ev .badge{flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font:800 15px/1 var(--display); color:var(--on-tone);}
.ev .src{font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;}
.ev .src .i{color:var(--good); stroke-width:3; font-size:14px;}
.ev .note{font-size:13px; color:var(--ink-soft); line-height:1.45; margin-top:2px;}
.empty{font-size:13.5px; color:var(--ink-soft); margin:0;}

.flags{margin:0; padding:0; list-style:none; display:grid; gap:9px;}
.flags li{display:flex; align-items:flex-start; gap:10px; font-size:14px; font-weight:600; padding:11px 14px; border-radius:12px; background:var(--bad-soft); color:var(--ink); line-height:1.45;}
.flags li .i{color:var(--bad); font-size:18px; margin-top:1px;}

.advice{margin:0; padding:0; list-style:none; display:grid; gap:10px;}
.advice li{display:flex; gap:10px; font-size:14px; line-height:1.45;}
.advice li .i{color:var(--pink); font-size:17px; margin-top:2px; stroke-width:2.6;}
.full{grid-column:1 / -1;}

.demo-note{margin-top:38px; padding-top:16px; border-top:1.5px solid var(--line); font-size:12.5px; color:var(--ink-soft); max-width:70ch;}

.banner.none{--tone:var(--ink-soft); --tone-soft:var(--accent-soft);}
.sr{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
#result:focus{outline:none;}
.msg{margin-top:12px; padding:12px 16px; border-radius:14px; background:var(--bad-soft); border:1.5px solid var(--bad); color:var(--ink); font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.msg[hidden]{display:none!important;}
.msg .i{color:var(--bad); font-size:18px;}
.msg span{flex:1 1 220px; min-width:0;}
.retrybtn{border:0; border-radius:99px; padding:8px 16px; background:var(--bad); color:var(--on-tone); font:700 13px/1 var(--body); cursor:pointer;}
.privacy{display:flex; align-items:center; gap:7px; margin:10px 0 0; font-size:12.5px; color:var(--ink-soft);}
.privacy .i{font-size:15px; color:var(--good);}
.ev .meta{display:flex; flex-wrap:wrap; gap:3px 14px; margin-top:6px; font-size:12px; color:var(--ink-soft);}
.ev .meta a{display:inline-flex; align-items:center; gap:4px; color:var(--blue); font-weight:700; text-decoration:none;}
.ev .meta a:hover{text-decoration:underline;}
.ev .meta a:focus-visible{outline:3px solid var(--violet); outline-offset:2px; border-radius:4px;}

.sharebtn{display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:99px; background:var(--wa); color:var(--on-tone); font:700 13px/1 var(--body); text-decoration:none; transition:filter .15s, transform .12s;}
.sharebtn:hover{filter:brightness(1.1);}
.sharebtn:active{transform:scale(.97);}
.sharebtn .i{font-size:16px;}

/* screenshot upload */
.upload{margin-top:16px;}
.upload[hidden], .thumb[hidden]{display:none!important;}

.composer{box-sizing:border-box; min-width:0; max-width:100%; flex:1 1 100%; display:flex; align-items:center; gap:6px; padding:6px 6px 6px 14px; border:2px solid var(--line); border-radius:22px; background:var(--card); transition:border-color .15s, box-shadow .15s, background .15s;}
.composer:focus-within{border-color:var(--violet); box-shadow:0 0 0 5px color-mix(in srgb,var(--violet) 25%,transparent);}
.composer.over{border-color:var(--pink); background:color-mix(in srgb,var(--pink) 12%,var(--card));}
.composer input[type=text]{flex:1 1 auto; border:0; background:transparent; padding:13px 6px; border-radius:0; box-shadow:none; min-width:0;}
.composer input[type=text]:focus-visible{box-shadow:none; border:0;}
.kind{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none; font-size:19px; color:var(--blue); background:color-mix(in srgb,var(--blue) 14%,transparent); transition:color .15s, background .15s;}
.composer.is-link .kind{color:var(--pink); background:color-mix(in srgb,var(--pink) 16%,transparent);}
.ibtn{width:42px; height:42px; border-radius:13px; border:0; display:grid; place-items:center; flex:none; font-size:21px; cursor:pointer; color:var(--c); background:color-mix(in srgb,var(--c) 15%,transparent); transition:transform .12s, background .15s;}
.ibtn:hover{background:color-mix(in srgb,var(--c) 28%,transparent); transform:translateY(-1px);}
.ibtn:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent); outline-offset:2px;}
.composer button.go{padding:14px 24px; border-radius:16px; flex:none;}
@media (max-width:520px){.composer{padding-left:10px; gap:4px;} .kind{display:none;} .composer button.go{padding:14px 16px;} .composer button.go [data-t]{display:none;} .ibtn{width:38px; height:38px;}}
.dropzone{width:100%; display:flex; align-items:center; gap:16px; text-align:left; padding:18px 20px; border-radius:22px; cursor:pointer; color:var(--ink); font-family:inherit; border:2px dashed color-mix(in srgb,var(--violet) 55%,transparent); background:color-mix(in srgb,var(--violet) 10%,var(--card)); transition:background .15s, border-color .15s;}
.dropzone:hover, .dropzone.over{border-color:var(--violet); background:color-mix(in srgb,var(--violet) 20%,var(--card));}
.dropzone .big{width:54px; height:54px; border-radius:17px; background:linear-gradient(135deg,var(--violet),var(--pink)); color:var(--on-tone); display:grid; place-items:center; font-size:27px; flex:none;}
.dropzone .tx{min-width:0;}
.dropzone b{display:block; font:800 18px/1.2 var(--display); margin-bottom:3px;}
.dropzone .s{display:block; font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
.upload:has(#thumb[hidden]) .upnote{display:none;}
.upnote{margin:8px 0 0; font-size:12.5px; color:var(--ink-soft); display:flex; gap:7px; align-items:center;}
.upnote .i{font-size:15px; color:var(--violet);}
.thumb{margin-top:12px; display:flex; align-items:center; gap:14px; padding:12px; border-radius:18px; background:var(--card); border:1.5px solid var(--line);}
.thumb img{width:64px; height:64px; object-fit:cover; border-radius:12px; flex:none; border:1.5px solid var(--line);}
.thumb .tm{flex:1; min-width:0; font-weight:600; font-size:14px; display:flex; align-items:center; gap:10px;}
.spin{width:18px; height:18px; border-radius:50%; flex:none; border:3px solid color-mix(in srgb,var(--violet) 25%,transparent); border-top-color:var(--violet); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.thumb .x{border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:8px 14px; font:700 13px/1 var(--body); cursor:pointer;}
.thumb .x:hover{border-color:var(--violet);}

@media (prefers-reduced-motion:reduce){
  .spin{animation-duration:2.4s;}
  .bg,.mark,.gauge,.step.active .dot{animation:none;}
  .block,.step{animation:none; opacity:1; transform:none;}
  .iconbtn:hover{transform:none;}
}

    if (BAD_TLDS.includes(tld)) sig.push([20, "tld", tld]);

  if (hasScheme && /^http:\/\//i.test(s) && !official) sig.push([10, "http"]);
  const risk = Math.min(97, sig.reduce((a, x) => a + x[0], 0));
  const state = risk >= 60 ? "scam" : risk >= 25 ? "warn" : official ? "trusted" : "clean";
  const verdict = state === "scam" ? "likely_scam" : "insufficient";
  const out = { verdict, confidence: state === "scam" ? Math.min(92, 60 + Math.round(risk / 3)) : state === "warn" ? 58 : 55,
    trust: state === "scam" ? Math.max(3, 100 - risk) : state === "warn" ? 100 - risk : official ? 70 : 55,
    scores: { claim_accuracy: 50, source_credibility: official ? 90 : state === "clean" ? 50 : Math.max(10, 100 - risk), scam_risk: official ? 3 : Math.max(8, risk), manipulation_risk: Math.min(80, 10 + sig.filter((x) => x[1] === "words").length * 20) },
    evSrc: [] };

  for (const code of ["en", "hi", "te"]) {
    const T = LK[code];
    out[code] = { claim: shown,
      explain: state === "scam" ? T.scam(sig.length) : T[state](),
      flags: sig.map((x) => T[x[1]](x[2], x[3])),
      notes: [],
      advice: state === "scam" ? T.advScam : state === "warn" ? T.advWarn : T.advOk };
  }
  return out;
}

function countUp(el, to) {

  (function step(now) {

function confetti() {
  if (reduceMotion) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  const colors = ["#3556ff", "#8447f0", "#e83e94", "#f5a300", "#12c48b", "#ffffff"];
  const bits = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - .5) * 120, y: H * 0.32,
    vx: (Math.random() - .5) * 15, vy: -Math.random() * 14 - 4,
    s: Math.random() * 7 + 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
    c: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  (function frame(now) {
    const e = now - t0;
    ctx.clearRect(0, 0, W, H);
    bits.forEach((b) => {
      b.vy += .32; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.globalAlpha = Math.max(0, 1 - e / 2800);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      ctx.restore();
    });
    if (e < 2800) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

let tessPromise = null;
function loadTesseract() {

  if (!tessPromise) tessPromise = new Promise((resolve, reject) => {

async function ocrImage(file, ctl, onStatus) {

  const stop = () => { try { if (worker) worker.terminate(); } catch (e) {} };
  ctl.signal.addEventListener("abort", stop);

    const mine = (l) => ({ langPath: LANG_BASE + "eng/4.0.0_best_int" });
    const tries = codes.length === 1 ? [{ l: ["eng"], o: mine() }, { l: ["eng"], o: {} }] : [{ l: codes, o: {} }, { l: ["eng"], o: mine() }];

async function readImage(file) {

  if (file.size > maxBytes) { showMsg(t("errImgBig").replace("{mb}", String(Math.round(maxBytes / 1048576)))); return; }

  setThumb(thumbUrl, t("reading"), true);

  try {

    if (sampleFn && (!imgLimits.mediaTypes || imgLimits.mediaTypes.includes(file.type))) {
      try {
        const res = await sampleFn(IMG_PROMPT, { images: file, modelTier: "quick", signal: ctl.signal });

    if (r.verdict === "supported" && celebrate) setTimeout(confetti, 350);
    out.focus({ preventScroll: true });
    out.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }
}

/* ---------- input checks and error messages ---------- */
const MIN_LEN = 3, MAX_LEN = 500;
function hideMsg() { const m = $("#msg"); m.hidden = true; m.innerHTML = ""; }
function showMsg(text, retry) {
  const m = $("#msg"); m.hidden = false;
  m.innerHTML = `${icon("alert")}<span>${esc(text)}</span>` + (retry ? `<button type="button" class="retrybtn" id="retrybtn">${esc(t("retry"))}</button>` : "");
  if (retry) $("#retrybtn").addEventListener("click", () => { hideMsg(); retry(); });
}

async function run(text, key) {
  hideMsg(); syncKind();
  const clean = text.trim();
  if (clean.length < MIN_LEN) { showMsg(t("errShort")); $("#q").focus(); return; }
  if (clean.length > MAX_LEN) { showMsg(t("errLong")); $("#q").focus(); return; }
  $("#go").disabled = true; $("#result").hidden = true;
  try {
    const r = resolve(clean, key);
    await playTrace(renderTrace(), r);
    $("#trace").hidden = true;   // the steps have played; keep the result near the top of the page
    current = { text: clean, key, r };
    history = [{ text: clean, key, verdict: r.verdict }, ...history.filter((h) => h.text !== clean)].slice(0, 5);
    renderHistory();
    renderResult(current, true);
  } catch (err) {
    $("#trace").hidden = true;
    showMsg(t("errFail"), () => run(text, key));
  } finally {
    $("#go").disabled = false;
  }
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); run($("#q").value, null); });
$("#examples").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const key = b.dataset.ex, claim = DB[key][lang].claim;
  $("#q").value = claim; run(claim, key);
});

/* ---------- one box: type, paste a link, or add a screenshot ---------- */
function syncKind() {
  const isLink = URL_ONLY.test($("#q").value);
  $("#composer").classList.toggle("is-link", isLink);
  $("#kind").innerHTML = icon(isLink ? "link" : "search");
}
$("#q").addEventListener("input", syncKind);
$("#linkbtn").addEventListener("click", async () => {
  $("#q").focus();
  try {
    const txt = await navigator.clipboard.readText();
    if (txt && txt.trim()) { $("#q").value = txt.trim().slice(0, MAX_LEN); syncKind(); }
  } catch (e) { /* clipboard blocked: the box is focused, so the person can paste with Ctrl+V */ }
});
syncKind();
window.addEventListener("resize", () => { $("#q").placeholder = window.innerWidth <= 520 ? t("phS") : t("ph"); });

applyStatic();
paintThemeBtn();
initP = initSample();
</script>
